# Deploys once a day, not on every merge (Jared, 2026-09-21). The daily run
# skips the build when `main` has not moved since the previous day, so an idle
# repo costs one short runner. A supervisor who needs the site current sooner
# dispatches this workflow by hand. Do not re-add the `push` trigger.

name: Deploy to GitHub Pages

on:
  schedule:
    # Daily, 10:00 UTC (05:00 America/Chicago), one hour after the nightly CI.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      publish_gallery:
        description: Capture and publish the screenshot gallery (slow; CI already provides it)
        type: boolean
        default: false

# Pages needs these; nothing else in the repo does.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer commit supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  freshness:
    name: Has main moved since yesterday?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # `true` when HEAD is younger than the daily window; the build keys on it.
      fresh: ${{ steps.fresh.outputs.fresh }}
    steps:
      - uses: actions/checkout@v4

      - id: fresh
        # 25 hours, not 24: cron start times jitter by minutes, and a commit
        # that lands in the gap would otherwise never deploy. A repeated
        # deploy of the same revision is harmless.
        run: |
          if [ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build site
    needs: freshness
    # A manual dispatch always builds; the daily run only when `main` moved.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.freshness.outputs.fresh == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_gallery }}
        run: npx playwright install --with-deps chromium

      - name: Capture the gallery
        id: gallery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_gallery }}
        # Runs before the Pages build on purpose: the gallery builds and serves
        # its own copy of the site at the root base, and the Pages build below
        # replaces dist/ afterwards. A review artefact, never a gate, so a
        # flaky capture must not hold up a deploy.
        continue-on-error: true
        run: npm run gallery

      - name: Build
        # Pages serves the site from /<repo>/, so the bundler base must match.
        env:
          GH_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA fallback for hash-free deep links
        run: cp dist/index.html dist/404.html

      - name: Publish the gallery beside the site
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_gallery && steps.gallery.outcome == 'success' }}
        # Optional publication only. Normal deployments contain the game alone;
        # the required CI gallery remains available as a downloadable artifact.
        run: |
          if [ -f gallery/index.html ]; then cp -r gallery dist/gallery; fi

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run instead of failing with
          # "Get Pages site failed ... Not Found". Uses the job's `pages: write`
          # token, so nobody has to click through Settings -> Pages first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
