name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; nothing else in the repo does.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer commit supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Capture the gallery
        # Runs before the Pages build on purpose: the gallery builds and serves
        # its own copy of the site at the root base, and the Pages build below
        # replaces dist/ afterwards. A review artefact, never a gate, so a
        # flaky capture must not hold up a deploy.
        continue-on-error: true
        run: npm run gallery

      - name: Build
        # Pages serves the site from /<repo>/, so the bundler base must match.
        env:
          GH_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA fallback for hash-free deep links
        run: cp dist/index.html dist/404.html

      - name: Publish the gallery beside the site
        # Reachable at /<repo>/gallery/ once deployed; skipped if the capture failed.
        run: |
          if [ -f gallery/index.html ]; then cp -r gallery dist/gallery; fi

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run instead of failing with
          # "Get Pages site failed ... Not Found". Uses the job's `pages: write`
          # token, so nobody has to click through Settings -> Pages first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
