name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit + content-validation + simulator tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle budget (300 KB gzipped)
        run: node scripts/check-bundle-size.mjs

      - name: Check every sheet in the manifest against its files
        run: npm run art:validate

      - name: Check asset budget (4 MB a family, 25 MB precached)
        run: npm run check:assets

      - name: Balance report
        # Prints win rates per encounter at every table size. Fails only on an
        # anomaly (a stalemate, impossible HP); the tuning band is a target to
        # read, not a gate.
        run: npm run balance
        env:
          BALANCE_TRIALS: 40
          # The per-path sweep runs every discipline against every encounter
          # with both sides levelled past the gate, so its trial count costs
          # 40 fights a go. It is a tripwire for an obviously broken path, not
          # a measurement — keep it cheap here and raise it locally when tuning.
          BALANCE_DISCIPLINE_TRIALS: 6

  e2e:
    name: End-to-end (Chromium touch, WebKit iPad)
    needs: verify
    runs-on: ubuntu-latest
    # Recent successful jobs took 41-48 minutes; cap stalled runs with headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium and WebKit for Playwright
        # WebKit is the iPad's engine; the iPad projects in playwright.config.ts
        # only exist when CI is set (or FNT_E2E_WEBKIT=1 locally).
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e suite
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  gallery:
    name: Screenshot gallery
    # Preserve the required gallery, but spend capture minutes only after the
    # gameplay suite passes. Failed revisions cannot merge and need no gallery.
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    # Recent successful captures took up to 62 minutes; retain every gallery case.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Capture the gallery
        # Every beat on every project, against the production build, with a
        # fixed seed. It is the review loop for anything visual: download the
        # artefact and open index.html.
        run: npm run gallery

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: gallery
          path: gallery/
          retention-days: 7
