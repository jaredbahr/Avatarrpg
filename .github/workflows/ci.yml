name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit + content-validation + simulator tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle budget (300 KB gzipped)
        run: node scripts/check-bundle-size.mjs

      - name: Check every sheet in the manifest against its files
        run: npm run art:validate

      - name: Check asset budget (4 MB a family, 25 MB precached)
        run: npm run check:assets

      - name: Balance report
        # Prints win rates per encounter at every table size. Fails only on an
        # anomaly (a stalemate, impossible HP); the tuning band is a target to
        # read, not a gate.
        run: npm run balance
        env:
          BALANCE_TRIALS: 40
          # The per-path sweep runs every discipline against every encounter
          # with both sides levelled past the gate, so its trial count costs
          # 40 fights a go. It is a tripwire for an obviously broken path, not
          # a measurement — keep it cheap here and raise it locally when tuning.
          BALANCE_DISCIPLINE_TRIALS: 6

  browser_e2e:
    name: E2E ${{ matrix.label }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Chromium project is the software-WebGL suite. It measured
          # roughly 36 minutes for its first 86 cases and projects near 90
          # minutes for all 181, so three shards keep every runner inside the
          # job limit while still covering each case exactly once.
          - label: Chromium touch 1/3
            browser: chromium
            artifact: chromium-1
            projects: --project=surface-touch --shard=1/3
          - label: Chromium touch 2/3
            browser: chromium
            artifact: chromium-2
            projects: --project=surface-touch --shard=2/3
          - label: Chromium touch 3/3
            browser: chromium
            artifact: chromium-3
            projects: --project=surface-touch --shard=3/3
          - label: WebKit iPad
            browser: webkit
            artifact: webkit
            projects: --project=ipad-landscape --project=ipad-portrait
    # Each runner executes one shard, or the complete WebKit coverage, on a
    # machine of its own.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browser for Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run e2e suite
        run: npm run e2e -- ${{ matrix.projects }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: playwright-report/
          retention-days: 7

  e2e:
    name: End-to-end (Chromium touch, WebKit iPad)
    needs: browser_e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both browser projects to pass
        run: test '${{ needs.browser_e2e.result }}' = 'success'

  gallery_shards:
    name: Gallery ${{ matrix.label }}
    # Preserve the required gallery, but spend capture minutes only after the
    # gameplay suite passes. Failed revisions cannot merge and need no gallery.
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # How long one runner takes is a property of the runner, not of the
          # cases. The last complete capture on a healthy runner (run
          # 35334403790) spent 5.9 minutes on surface-canvas, 25.3 on
          # surface-webgl, 2.5 on ipad-canvas, 23.2 on ipad-webgl and 1.3 on
          # portrait-canvas, 58 minutes in all against a 75-minute limit. The
          # runner that carried head 966d33a was about three times slower: it
          # reached 119 of 340 cases when the limit canceled it. Sharding keeps
          # the longest job near a third of that even on a slow runner, and the
          # aggregate job below merges the shards back into the one `gallery`
          # artefact reviewers download and open.
          #
          # Playwright shards by file, so `--shard=i/3` resolves to one file
          # only because the catalogue is dealt into the three slice spec files
          # (`e2e/gallery/gallery-{a,b,c}.spec.ts`). This measured 9.0/8.4/8.2
          # minutes of surface-webgl and 6.3/9.2/8.4 of ipad-webgl on a healthy
          # runner; both backends' 2x and 1x stills are far cheaper.
          - label: Canvas
            artifact: canvas
            projects: --project=surface-canvas --project=ipad-canvas --project=portrait-canvas
          - label: Surface WebGL 1/3
            artifact: surface-webgl-1
            projects: --project=surface-webgl --shard=1/3
          - label: Surface WebGL 2/3
            artifact: surface-webgl-2
            projects: --project=surface-webgl --shard=2/3
          - label: Surface WebGL 3/3
            artifact: surface-webgl-3
            projects: --project=surface-webgl --shard=3/3
          - label: iPad WebGL 1/3
            artifact: ipad-webgl-1
            projects: --project=ipad-webgl --shard=1/3
          - label: iPad WebGL 2/3
            artifact: ipad-webgl-2
            projects: --project=ipad-webgl --shard=2/3
          - label: iPad WebGL 3/3
            artifact: ipad-webgl-3
            projects: --project=ipad-webgl --shard=3/3
    # One project, or one third of one, on a machine of its own.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Capture this shard of the gallery
        # Every beat against the production build, with a fixed seed. It is the
        # review loop for anything visual.
        run: npm run gallery:capture -- ${{ matrix.projects }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: gallery-shard-${{ matrix.artifact }}
          path: gallery/
          retention-days: 7

  gallery:
    name: Screenshot gallery
    needs: gallery_shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every gallery shard to pass
        run: test '${{ needs.gallery_shards.result }}' = 'success'

      - uses: actions/checkout@v4

      - name: Collect the shards
        uses: actions/download-artifact@v4
        with:
          pattern: gallery-shard-*
          path: gallery
          merge-multiple: true

      - name: Assemble the gallery page
        # One index over every shard, so the reviewer still downloads a single
        # artefact and opens its index.html.
        run: node scripts/gallery-index.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: gallery/
          retention-days: 7
