# THROWAWAY PROBE BRANCH. Never merge. Runs the cases named in e2e/.probe on WebKit only.
name: CI
on:
  workflow_dispatch:
jobs:
  probe:
    name: WebKit probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Probe
        run: |
          set -o pipefail
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::group::$line"
            eval "npx playwright test $line" || true
            echo "::endgroup::"
          done < e2e/.probe
