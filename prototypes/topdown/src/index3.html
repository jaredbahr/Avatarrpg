<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ba Dan Lane</title>
<style>
  :root {
    --ink: #1c1719; --panel: #2a2124; --cream: #f6eed6; --sand: #e8d8b0; --ember: #c9473a; --gold: #d9a441;
    --tap: 3.25rem;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .pad { position: fixed; left: max(1rem, env(safe-area-inset-left)); bottom: max(1rem, env(safe-area-inset-bottom));
    width: calc(var(--tap) * 3); height: calc(var(--tap) * 3); display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 0.125rem; opacity: 0.82; }
  .pad button, .act { border: 0.1875rem solid var(--ink); background: color-mix(in srgb, var(--panel) 85%, transparent);
    color: var(--sand); font: bold 1.1rem/1 monospace; padding: 0; border-radius: 0.25rem;
    box-shadow: inset 0 -0.1875rem 0 color-mix(in srgb, var(--ink) 60%, transparent); touch-action: none; }
  .pad button.on, .act.on { background: color-mix(in srgb, var(--ember) 80%, transparent); color: var(--cream); }
  .pad .u { grid-area: 1 / 2; } .pad .l { grid-area: 2 / 1; } .pad .r { grid-area: 2 / 3; } .pad .d { grid-area: 3 / 2; }
  .act { position: fixed; right: max(1rem, env(safe-area-inset-right)); bottom: max(1.75rem, env(safe-area-inset-bottom));
    width: calc(var(--tap) * 1.5); height: calc(var(--tap) * 1.5); border-radius: 50%; font-size: 0.9rem; opacity: 0.82; }
  .act[disabled] { opacity: 0.3; }
  .act.bend { bottom: calc(max(1.75rem, env(safe-area-inset-bottom)) + var(--tap) * 1.5 + 0.75rem); background: color-mix(in srgb, var(--ember) 70%, transparent); color: var(--cream); }
  #dlg { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(1rem, env(safe-area-inset-bottom));
    width: min(34rem, calc(100% - 2rem)); box-sizing: border-box; background: var(--panel); color: var(--cream);
    border: 0.25rem solid var(--sand); outline: 0.1875rem solid var(--ink); padding: 0.75rem 1rem 1.25rem;
    font: 1rem/1.45 monospace; display: none; image-rendering: pixelated; }
  #dlg b { color: var(--gold); display: block; margin-bottom: 0.25rem; letter-spacing: 0.05em; }
  #dlg .more { position: absolute; right: 0.75rem; bottom: 0.25rem; color: var(--sand); animation: bob 0.8s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(0.2rem); } }
  #hint { position: fixed; top: max(0.5rem, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    color: var(--sand); font: 0.8rem/1.3 monospace; background: color-mix(in srgb, var(--ink) 70%, transparent);
    padding: 0.25rem 0.6rem; border-radius: 0.25rem; white-space: nowrap; transition: opacity 1s; }
  body.rec .pad, body.rec .act, body.rec #hint { display: none; }
  @media (hover: hover) and (pointer: fine) { .pad, .act { display: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="hint">Tap to walk · arrows / WASD · Space or J to bend · E to talk</div>
<div class="pad" id="pad">
  <button class="u" data-d="0,-1" aria-label="up">▲</button>
  <button class="l" data-d="-1,0" aria-label="left">◀</button>
  <button class="r" data-d="1,0" aria-label="right">▶</button>
  <button class="d" data-d="0,1" aria-label="down">▼</button>
</div>
<button class="act" id="act" disabled>TALK</button>
<button class="act bend" id="bend">BEND</button>
<div id="dlg"><b id="dlgName"></b><span id="dlgText"></span><span class="more">▼</span></div>
<script>
/*ASSETS*/
/*GAME*/
</script>
</body>
</html>
