<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Forest Road Ambush</title>
<style>
  :root { --ink: #1c1719; --panel: #2a2124; --cream: #f6eed6; --sand: #e8d8b0; --ember: #c9473a; --gold: #d9a441; --sky: #4a8f98; --tap: 3rem; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(0.75rem, env(safe-area-inset-bottom)); display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 1rem); }
  #bar button { min-width: calc(var(--tap) * 1.6); min-height: var(--tap); border: 0.1875rem solid var(--ink); border-radius: 0.4rem; background: color-mix(in srgb, var(--panel) 88%, transparent); color: var(--sand); font: bold 0.8rem/1.1 monospace; padding: 0 0.6rem; }
  #bar button.on { background: color-mix(in srgb, var(--ember) 80%, transparent); color: var(--cream); }
  #bar button[disabled] { opacity: 0.35; }
  #top { position: fixed; top: max(0.5rem, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); color: var(--cream); font: bold 0.85rem/1.3 monospace; background: color-mix(in srgb, var(--ink) 75%, transparent); padding: 0.3rem 0.8rem; border-radius: 0.25rem; text-align: center; max-width: calc(100% - 2rem); }
  #banner { position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); color: var(--gold); font: bold 2.2rem/1 monospace; letter-spacing: 0.2em; text-shadow: 0 0.2rem 0 var(--ink), 0 0 0.6rem var(--ink); opacity: 0; pointer-events: none; transition: opacity 0.6s; }
  #banner.show { opacity: 1; }
  #banner small { display: block; font-size: 0.9rem; letter-spacing: 0.1em; color: var(--sand); margin-top: 0.6rem; text-align: center; }
  #name { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); color: var(--cream); font: bold 1rem/1 monospace; letter-spacing: 0.1em; text-shadow: 0 0.125rem 0 var(--ink); opacity: 0; pointer-events: none; }
  #name.show { animation: nm 1.1s steps(6) forwards; }
  @keyframes nm { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="top"></div>
<div id="name"></div>
<div id="banner"></div>
<div id="bar"></div>
<script>
/*ASSETS*/
/*GAME*/
</script>
</body>
</html>
