<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#1b1410" />
    <!-- Added to the Home Screen on an iPad or an Android tablet, launch as a
         full-screen app rather than a browser tab. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FN Tactics" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Four Nations Tactics - a hot-seat turn-based tactical RPG. Non-commercial fan work."
    />
    <!-- A private family fan project: reachable by URL, but not advertised. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- The display face, fetched alongside the CSS rather than after it; the
         crossorigin is not optional, fonts always load anonymously and a
         preload without it is thrown away. -->
    <link
      rel="preload"
      href="fonts/shippori-mincho-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Four Nations Tactics</title>
  </head>
  <body>
    <div id="app" class="app-root" data-scene="boot">
      <noscript>
        <p class="boot-message">Four Nations Tactics needs JavaScript enabled to run.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
